<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Stickman vs Geometry</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:absolute;display:block}
  #touch{position:absolute;inset:0;display:none;pointer-events:none}
  #touch button{position:absolute;width:14vmin;height:14vmin;border-radius:50%;border:2px solid #fff8;background:#ffffff14;color:#fff;font:600 6vmin Georgia,serif;pointer-events:auto;-webkit-tap-highlight-color:transparent;padding:0}
  #touch button.s{width:9vmin;height:9vmin;font-size:3.6vmin;top:2vmin}

<body>
<canvas id="g"></canvas>
<div id="touch">
  <button data-c="ArrowLeft" style="left:2vw;bottom:15vmin">‹</button>
  <button data-c="ArrowRight" style="left:calc(2vw + 28vmin);bottom:15vmin">›</button>
  <button data-c="ArrowUp" style="left:calc(2vw + 14vmin);bottom:29vmin">ˆ</button>
  <button data-c="ArrowDown" style="left:calc(2vw + 14vmin);bottom:1vmin">ˇ</button>
  <button data-c="KeyX" style="right:calc(2vw + 16vmin);bottom:6vmin">φ</button>
  <button data-c="Space" style="right:2vw;bottom:15vmin">↑</button>
  <button class="s" data-c="KeyP" style="right:2vw">II</button>
  <button class="s" data-c="KeyH" style="right:calc(2vw + 11vmin)">?</button>
  <button class="s" data-c="KeyR" style="right:calc(2vw + 22vmin)">↺</button>
</div>
<script>
'use strict';
/* ---------- basics ---------- */
const W=1280,H=720,TAU=Math.PI*2,PHI=(1+Math.sqrt(5))/2;
const ORANGE='#ff6a0d',GOLD='#ffd23a';
const cv=document.getElementById('g'),c=cv.getContext('2d');
let VS=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2),s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.style.left=(innerWidth-W*s)/2+'px';cv.style.top=(innerHeight-H*s)/2+'px';
  cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);VS=s*dpr;
}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- input ---------- */
const keys={},hit={};
const MAP={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],
  jump:['Space','ArrowUp','KeyW','KeyZ'],fire:['KeyX','KeyJ','KeyK'],start:['Enter','Space']};
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!e.repeat){keys[e.code]=true;hit[e.code]=true}
  ainit();
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const held=n=>MAP[n].some(k=>keys[k]),tapped=n=>MAP[n].some(k=>hit[k]);
const TOUCH='ontouchstart' in window||navigator.maxTouchPoints>0;
cv.addEventListener('pointerdown',e=>{ainit();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(G.state==='select'&&!G.help){const i=cardAt(x,y);if(i<0)return;G.sel=i}
  hit.Enter=true});
if(TOUCH){
  const t=document.getElementById('touch');t.style.display='block';
  for(const b of t.querySelectorAll('button')){const code=b.dataset.c;
    b.addEventListener('pointerdown',e=>{e.preventDefault();ainit();keys[code]=true;hit[code]=true});
    const up=e=>{e.preventDefault();keys[code]=false};
    b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
  }
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- audio ---------- */
const A={ctx:null,out:null};
function ainit(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return}
  try{A.ctx=new (window.AudioContext||window.webkitAudioContext)();A.out=A.ctx.createGain();A.out.gain.value=.5;A.out.connect(A.ctx.destination)}catch(e){}
}
function tone(f,d,type='sine',v=.15,f2){
  if(!A.ctx||G.mute)return;
  const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(A.out);o.start(t);o.stop(t+d+.02);
}
function noise(d,v=.2){
  if(!A.ctx||G.mute)return;
  const n=Math.floor(A.ctx.sampleRate*d),b=A.ctx.createBuffer(1,n,A.ctx.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=A.ctx.createBufferSource(),g=A.ctx.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(A.out);s.start();
}
const sfx={
  jump:()=>tone(330,.14,'triangle',.12,620),
  phi:()=>{tone(880,.12,'sine',.12);setTimeout(()=>tone(880*PHI,.2,'sine',.1),60)},
  hurt:()=>{noise(.25,.3);tone(160,.3,'sawtooth',.12,60)},
  stumble:()=>{noise(.12,.2);tone(200,.15,'square',.07,110)},
  throw:()=>tone(520,.12,'triangle',.1,1040),
  bossHit:()=>{noise(.1,.2);tone(1200,.18,'square',.07,300)},
  beam:()=>tone(1400,.35,'sawtooth',.09,200),
  slam:()=>{noise(.45,.4);tone(90,.5,'sine',.3,35)},
  boom:()=>{noise(1.2,.5);tone(70,1.2,'sine',.35,25)},
  clear:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.4,'sine',.12),i*110)),
};
const SCALE=[110,130.8,146.8,164.8,196,220,261.6,293.7,329.6,392];
const music={t:0,i:0};
function musicTick(dt){
  if(G.state!=='play'||G.paused)return;
  const fast=[0,1,2,7,12,14].includes(G.stage);
  music.t-=dt;if(music.t>0)return;
  music.t=fast?.17:.34;const i=music.i++;
  if(G.stage===15){if(i%4===0)tone(SCALE[5+(i/4)%5|0]*2,1.2,'sine',.05);return}
  if(i%4===0)tone(SCALE[[0,0,3,2][(i>>4)%4]]/2,.3,'triangle',.13);
  if(fast&&i%2===1)tone(SCALE[[5,7,8,7,9,8,7,5][(i>>1)%8]],.12,'sine',.035);
  if(!fast&&i%2===0)tone(SCALE[[5,8,7,9][(i>>1)%4]],.5,'sine',.04);
}

/* ---------- wireframe solids ---------- */
function buildShape(v,d){
  const e=[];let m=0;
  for(let i=0;i<v.length;i++){m=Math.max(m,Math.hypot(...v[i]));for(let j=i+1;j<v.length;j++){
    let s=0;for(let k=0;k<v[i].length;k++)s+=(v[i][k]-v[j][k])**2;
    if(Math.abs(Math.sqrt(s)-d)<1e-3)e.push([i,j]);}}
  return{v:v.map(p=>p.map(x=>x/m)),e,dim:v[0].length};
}
const SH=(()=>{
  const c24=[],ico=[],dod=[];
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)for(const a of[-1,1])for(const b of[-1,1]){const v=[0,0,0,0];v[i]=a;v[j]=b;c24.push(v)}
  for(let k=0;k<3;k++)for(const a of[-1,1])for(const b of[-1,1]){
    let v=[0,0,0];v[(k+1)%3]=a;v[(k+2)%3]=b*PHI;ico.push(v);
    v=[0,0,0];v[(k+1)%3]=a/PHI;v[(k+2)%3]=b*PHI;dod.push(v);
  }
  for(const a of[-1,1])for(const b of[-1,1])for(const d of[-1,1])dod.push([a,b,d]);
  const tes=[];for(let i=0;i<16;i++)tes.push([i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]);
  return{tes:buildShape(tes,2),c24:buildShape(c24,Math.SQRT2),ico:buildShape(ico,2),dod:buildShape(dod,2/PHI)};
})();
const rot2=(a,b,t)=>{const co=Math.cos(t),si=Math.sin(t);return[a*co-b*si,a*si+b*co]};
// o: {color,lw,nodes,spin,alpha,glow}
function drawShape(sh,cx,cy,R,t,o={}){
  const pts=[],k0=sh.dim===4?.62:.86;
  for(const p of sh.v){
    let x=p[0],y=p[1],z=p[2],w=p[3]||0;
    if(sh.dim===4){[x,w]=rot2(x,w,t*.55);[z,w]=rot2(z,w,t*.31)}
    [x,z]=rot2(x,z,t*.7);[y,z]=rot2(y,z,t*.43);
    if(sh.dim===4){const k=1.6/(2.1-w);x*=k;y*=k;z*=k}
    const k2=2.6/(3.2-z);x*=k2;y*=k2;
    if(o.spin)[x,y]=rot2(x,y,o.spin);
    pts.push([cx+x*R*k0,cy+y*R*k0]);
  }
  c.save();c.globalAlpha*=o.alpha==null?1:o.alpha;
  c.strokeStyle=o.color||'#fff';c.lineWidth=o.lw||1.6;c.lineCap='round';
  if(o.glow){c.shadowColor=o.glow;c.shadowBlur=18}
  c.beginPath();for(const[i,j]of sh.e){c.moveTo(pts[i][0],pts[i][1]);c.lineTo(pts[j][0],pts[j][1])}c.stroke();
  c.shadowBlur=0;
  if(o.nodes!==false){const r=o.nodeR||Math.max(2,R*.022);c.fillStyle='#000';c.lineWidth=1.2;
    for(const p of pts){c.beginPath();c.arc(p[0],p[1],r,0,TAU);c.fill();c.stroke()}}
  c.restore();return pts;
}

/* ---------- drawing helpers ---------- */
function node(x,y,r=5,lw=1.5){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle='#000';c.fill();c.strokeStyle='#fff';c.lineWidth=lw;c.stroke()}
function drawPhi(x,y,s,rot=0,color='#fff',glow){
  c.save();c.translate(x,y);c.rotate(rot);c.strokeStyle=color;c.lineCap='round';
  if(glow){c.shadowColor=glow;c.shadowBlur=22}
  c.lineWidth=s*.17;c.beginPath();c.ellipse(0,0,s*.36,s*.44,0,0,TAU);c.stroke();
  c.lineWidth=s*.09;c.beginPath();c.moveTo(0,-s*.85);c.lineTo(0,s*.85);c.stroke();
  c.restore();
}
function goldBlock(b){
  const g=c.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);
  g.addColorStop(0,'#3a3526');g.addColorStop(.45,'#9c7d1c');g.addColorStop(1,'#33332f');
  c.fillStyle=g;c.fillRect(b.x,b.y,b.w,b.h);c.strokeStyle='#fff';c.lineWidth=1.5;c.strokeRect(b.x,b.y,b.w,b.h);
  node(b.x,b.y,4);node(b.x+b.w,b.y,4);node(b.x,b.y+b.h,4);node(b.x+b.w,b.y+b.h,4);
}
// stick figure; (x,y) is the feet. o:{pose,ph,face,s,rot,color,alpha}
function drawStick(x,y,o={}){
  const ph=o.ph||0,pose=o.pose||'idle';
  let hip=[0,-30],neck=[0,-58],head=[0,-71],feet,hands;
  if(pose==='run'){
    neck=[7,-57];head=[11,-69];
    feet=[0,1].map(k=>{const t=ph+k*Math.PI;return[Math.sin(t)*19,-Math.max(0,Math.cos(t))*14]});
    hands=[0,1].map(k=>{const t=ph+(k+1)*Math.PI;return[5+Math.sin(t)*16,-42-Math.abs(Math.sin(t))*5]});
  }else if(pose==='jump'){neck=[3,-58];head=[5,-71];feet=[[-13,-10],[9,-3]];hands=[[-15,-68],[17,-64]]}
  else if(pose==='fall'||pose==='hurt'){feet=[[-11,-1],[13,-8]];hands=[[-20,-60],[20,-58]]}
  else if(pose==='surf'){hip=[0,-22];neck=[4,-47];head=[7,-60];feet=[[-13,0],[13,0]];hands=[[-22,-42],[24,-48]]}
  else if(pose==='throw'){neck=[4,-58];head=[7,-70];feet=[[-12,0],[12,0]];hands=[[-10,-36],[26,-60]]}
  else{const b=Math.sin(ph)*1.2;neck=[0,-58+b];head=[0,-71+b];feet=[[-8,0],[8,0]];hands=[[-11,-33+b],[11,-33+b]]}
  c.save();c.translate(x,y);if(o.rot)c.rotate(o.rot);c.scale((o.s||1)*(o.face||1),o.s||1);
  if(o.alpha!=null)c.globalAlpha*=o.alpha;
  c.strokeStyle=o.color||ORANGE;c.lineWidth=5.5;c.lineCap='round';c.lineJoin='round';
  c.beginPath();
  for(const f of feet){const kn=[(hip[0]+f[0])/2+7,(hip[1]+f[1])/2-2];c.moveTo(hip[0],hip[1]);c.quadraticCurveTo(kn[0],kn[1],f[0],f[1])}
  c.moveTo(hip[0],hip[1]);c.lineTo(neck[0],neck[1]);
  const sh=[neck[0]*.9,neck[1]+5];
  for(const h of hands){const el=[(sh[0]+h[0])/2-5,(sh[1]+h[1])/2+5];c.moveTo(sh[0],sh[1]);c.quadraticCurveTo(el[0],el[1],h[0],h[1])}
  c.stroke();
  c.beginPath();c.arc(head[0],head[1]-1,11.5,0,TAU);c.stroke();
  c.restore();
}
/* particles: short line fragments */
function burst(list,x,y,n,o={}){
  for(let i=0;i<n;i++){const a=o.ang!=null?o.ang+(Math.random()-.5)*(o.spread||1):Math.random()*TAU,s=(o.speed||260)*(.3+Math.random());
    list.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:(o.life||.7)*(.5+Math.random()),len:4+Math.random()*(o.len||10),rot:Math.random()*TAU,vr:(Math.random()-.5)*12,color:o.color||'#fff',g:o.g==null?500:o.g})}
}
function updParts(list,dt){
  for(let i=list.length-1;i>=0;i--){const p=list[i];p.life+=dt;if(p.life>p.max){list.splice(i,1);continue}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
}
function drawParts(list){
  c.lineWidth=1.6;c.lineCap='round';
  for(const p of list){c.globalAlpha=1-p.life/p.max;c.strokeStyle=p.color;const dx=Math.cos(p.rot)*p.len/2,dy=Math.sin(p.rot)*p.len/2;
    c.beginPath();c.moveTo(p.x-dx,p.y-dy);c.lineTo(p.x+dx,p.y+dy);c.stroke()}
  c.globalAlpha=1;
}
const STARS=(()=>{const r=rng(3),a=[];for(let i=0;i<140;i++)a.push([r()*W,r()*H,r()*1.3+.3,r()]);return a})();
function drawStars(ox=0,oy=0,al=.5,col='#fff'){
  c.fillStyle=col;
  for(const s of STARS){const x=((s[0]-ox*s[3]*.3)%W+W)%W,y=((s[1]-oy*s[3]*.3)%H+H)%H;c.globalAlpha=al*(.3+s[3]*.7);c.fillRect(x,y,s[2],s[2])}
  c.globalAlpha=1;
}
function text(s,x,y,size=20,col='#fff',align='center',weight=300){
  c.font=`${weight} ${size}px "Helvetica Neue",Helvetica,Arial,sans-serif`;c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y);
}

/* ---------- game state ---------- */
const G={state:'title',stage:0,t:0,phi:0,deaths:0,time:0,fade:0,trans:null,shake:0,banner:0,paused:false,mute:false,flash:0};
let ST=null;
const SAVE=(()=>{try{const a=localStorage.getItem('svg_save4');if(a)return Object.assign({unlocked:1,best:{}},JSON.parse(a));
  const o=JSON.parse(localStorage.getItem('svg_save3')||'{}'),b={};for(const k in o.best||{})if(+k<11)b[k]=o.best[k];
  return{unlocked:Math.min(o.unlocked||1,12),best:b}}catch(e){return{unlocked:1,best:{}}}})();
const persist=()=>{try{localStorage.setItem('svg_save4',JSON.stringify(SAVE))}catch(e){}};
G.sel=0;G.bloom=true;G.run={t:0,phi:0,deaths:0};G.result=null;

/* ---------- shared platformer physics ---------- */
const RUN=390,JUMP=820,GRAV=2300;
const yAt=(s,x)=>s.y1+(s.y2-s.y1)*(x-s.x1)/(s.x2-s.x1);
function newPlayer(x,y){return{x,y,vx:0,vy:0,ground:null,face:1,coy:0,buf:0,ph:0,stun:0,inv:0,pose:'idle',throwT:0}}
function platStep(p,w,dt){
  const ax=(held('right')?1:0)-(held('left')?1:0),max=p.stun>0?140:(p.maxv||RUN),fly=p.fly&&!p.ground;
  p.stun-=dt;p.inv-=dt;p.throwT-=dt;
  if(ax){if(!(fly&&Math.sign(p.vx)===ax&&Math.abs(p.vx)>=RUN))p.vx+=ax*(p.ground?3400:2400)*dt;p.face=ax}
  else if(!fly){const f=(p.ground?3000:500)*dt;p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f}
  if((!p.kb||p.kb<=0)&&!fly)p.vx=clamp(p.vx,-max,max);
  p.kb=(p.kb||0)-dt;
  p.buf=tapped('jump')?.12:p.buf-dt;p.coy=p.ground?.1:p.coy-dt;
  if(p.buf>0&&p.coy>0){p.vy=-JUMP;p.ground=null;p.coy=0;p.buf=0;sfx.jump()}
  const px=p.x,py=p.y;
  p.x+=p.vx*dt;
  if(w.minX!=null)p.x=clamp(p.x,w.minX,w.maxX);
  for(const b of w.blocks||[]){
    if(p.y>b.y+6&&p.y-60<b.y+b.h&&p.x+10>b.x&&p.x-10<b.x+b.w){
      if(px<b.x+b.w/2)p.x=b.x-10;else p.x=b.x+b.w+10;p.vx=0;}
  }
  if(p.ground){
    let s=p.ground;
    if(p.x<s.x1-2||p.x>s.x2+2){
      s=null;for(const q of w.segs)if(p.x>=q.x1&&p.x<=q.x2&&Math.abs(yAt(q,p.x)-p.y)<14){s=q;break}
      p.ground=s;
    }
    if(s){p.y=yAt(s,clamp(p.x,s.x1,s.x2));p.vy=0}
  }
  if(!p.ground){
    if(!held('jump')&&p.vy<-280)p.vy+=3200*dt;
    p.vy=Math.min(p.vy+GRAV*dt,1500);
    const ny=p.y+p.vy*dt;let land=null,ly=1e9;
    if(p.vy>=0)for(const s of w.segs){
      if(p.x<s.x1||p.x>s.x2)continue;
      const ys=yAt(s,p.x),yp=(px>=s.x1&&px<=s.x2)?yAt(s,px):ys;
      if(py<=yp+6+(s.rise||0)&&ny>=ys&&ys<ly){land=s;ly=ys}
    }
    if(land){p.y=ly;p.vy=0;p.ground=land;p.fly=false}else p.y=ny;
  }
  p.ph+=Math.abs(p.vx)*dt*.036+(p.ground&&Math.abs(p.vx)<30?dt*3:0);
  p.pose=p.throwT>0?'throw':!p.ground?(p.vy<0?'jump':'fall'):Math.abs(p.vx)>30?'run':'idle';
}
function drawPlayer(p){
  if(p.inv>0&&Math.floor(p.inv*14)%2)return;
  drawStick(p.x,p.y,{pose:p.stun>0?'hurt':p.pose,ph:p.ph,face:p.face});
}

/* ================= STAGE 1 — THE LINE ================= */
function Stage1(){
  const R=rng(11),segs=[],posts=[],phis=[],cps=[],parts=[];
  let x=-500,y=470;
  const add=(len,dy=0)=>{const s={x1:x,y1:y,x2:x+len,y2:y+dy};segs.push(s);x+=len;y+=dy;return s};
  add(1500);cps.push({x:0,y:470});
  for(let n=1;x<15500;n++){
    const gap=110+R()*80;let dy=(R()<.5?-1:1)*(28+R()*40);if(y+dy<370||y+dy>560)dy=-dy;
    phis.push({x:x+gap/2,y:Math.min(y,y+dy)-112});
    x+=gap;y+=dy;
    const len=430+R()*520;let tilt=(R()-.5)*80;if(y+tilt<360||y+tilt>570)tilt=-tilt;
    const s=add(len,tilt);
    if(len>560&&R()<.8)posts.push({x:s.x1+len*(.45+R()*.2),s});
    else if(R()<.6)phis.push({x:s.x1+len*.5,y:yAt(s,s.x1+len*.5)-42});
    if(n%5===0)cps.push({x:s.x1+50,y:yAt(s,s.x1+50)});
  }

/* ================= STAGE 2 — THE GOLDEN SPIRAL ================= */
function Stage2(){
  const N=17,K=700,AX=520,AY=560,R=rng(5),arcs=[],obs=[],phis=[],parts=[];
  {let cx=0,cy=0,r=1000,a0=Math.PI;
    for(let i=0;i<N+16;i++){arcs.push({cx,cy,r,a0});const a1=a0-Math.PI/2,ex=cx+r*Math.cos(a1),ey=cy+r*Math.sin(a1);cx=ex+(cx-ex)/PHI;cy=ey+(cy-ey)/PHI;r/=PHI;a0=a1}
    const L=arcs[arcs.length-1],ox=L.cx,oy=L.cy;for(const a of arcs){a.cx-=ox;a.cy-=oy}}
  for(let u=1.3;u<N-.7;){
    const q=R();
    if(q<.62)obs.push({u,type:'spike'});

    else{obs.push({u,type:'spike'});obs.push({u:u+.055,type:'spike'})}
    if(R()<.7)phis.push({u:u+.17,h:R()<.5?34:120});
    u+=.37+R()*.38;
  }
  const pt=u=>{const i=clamp(Math.floor(u),0,arcs.length-1),f=u-i,A=arcs[i],a=A.a0-f*Math.PI/2;return{x:A.cx+A.r*Math.cos(a),y:A.cy+A.r*Math.sin(a),a,i,f,r:A.r}};
  let u=.25,h=0,vh=0,buf=0,ph=0,gap=520,slow=0,inv=0,t=0,cp=.25;
  return{dbg:{obs,N,get u(){return u},get h(){return h},get gap(){return gap}},name:'II · THE GOLDEN SPIRAL',hint:'SPACE  jump the spikes     —     stay low under the hanging nodes',parts,
    respawn(){u=cp;h=0;vh=0;gap=500;slow=0;inv=1;for(const o of obs)o.hit=false},
    update(dt){
      t+=dt;inv-=dt;slow=Math.max(0,slow-dt);
      const P=pt(u),ppu=K*Math.pow(PHI,P.f)*Math.PI/2,v=(400+Math.min(u/N,1)*70)*(slow>0?.55:1);
      u+=v*dt/ppu;ph+=v*dt*.036;
      buf=tapped('jump')?.12:buf-dt;
      if(buf>0&&h===0){vh=780;buf=0;sfx.jump()}
      if(h>0||vh>0){if(!held('jump')&&vh>280)vh-=3200*dt;vh-=GRAV*dt;h+=vh*dt;if(h<=0){h=0;vh=0}}
      for(const o of obs){
        if(o.hit)continue;const d=(o.u-u)*ppu;
        if(o.type==='spike'?(Math.abs(d)<20&&h<36):(Math.abs(d)<14&&h>24)){
          o.hit=true;if(inv<=0){gap-=185;slow=.7;inv=.5;G.shake=10;sfx.stumble();burst(parts,AX,AY-30,12,{})}}
      }
      for(const f of phis)if(!f.got&&Math.abs((f.u-u)*ppu)<30&&Math.abs(h+34-f.h)<48){f.got=true;G.phi++;sfx.phi()}
      gap=Math.min(540,gap+24*dt);
      G.shake=Math.max(G.shake,clamp(1-(gap-150)/260,0,1)*5);
      if(gap<110){this.dead=true;sfx.hurt();return}
      if(u>cp+5&&h===0)cp=Math.floor(u);
      if(u>=N){this.done=true;G.phi+=5}
      updParts(parts,dt);
    },
    draw(){
      const P=pt(u),S=K*Math.pow(PHI,P.f)/P.r,rho=Math.PI/2-P.a,co=Math.cos(rho),si=Math.sin(rho);
      const scr=q=>{const dx=q.x-P.x,dy=q.y-P.y;return[AX+S*(co*dx-si*dy),AY+S*(si*dx+co*dy)]};
      drawStars(u*300,0,.3);

      for(let i=Math.max(0,P.i-5);i<Math.min(arcs.length,P.i+11);i++){
        const A=arcs[i],a1=A.a0-Math.PI/2,sx=A.cx+A.r*Math.cos(A.a0),sy=A.cy+A.r*Math.sin(A.a0),ex=A.cx+A.r*Math.cos(a1),ey=A.cy+A.r*Math.sin(a1);

        c.globalAlpha=1;c.lineWidth=2.4/S;c.beginPath();c.arc(A.cx,A.cy,A.r,A.a0,a1,true);c.stroke();

/* ================= STAGE 3 — THE VOID ================= */
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-ax-dx*t,py-ay-dy*t)}
function Stage3(){

    hud(){for(let i=0;i<3;i++){c.globalAlpha=i<hp?1:.2;drawPhi(W-40-i*34,40,22,.3,ORANGE)}c.globalAlpha=1},
    update(dt){
      t+=dt;inv-=dt;const k=clamp(t/T,0,1),vs=430+k*260;

      if(!landed){
        p.vx=lerp(p.vx,ax*480,dt*9);p.vy=lerp(p.vy,ay*330,dt*9);
        p.x=clamp(p.x+p.vx*dt,40,W-40);p.y=clamp(p.y+p.vy*dt,90,H-150);p.tilt=lerp(p.tilt,p.vx/480*.5,dt*8);
      }
      spawn-=dt;
      if(spawn<=0&&t<T){
        spawn=lerp(.8,.36,k)*(.7+Math.random()*.6);
        const r=45+Math.random()*(60+k*70),a0=Math.random()*TAU;
        tris.push({x:Math.random()<.35?p.x+(Math.random()-.5)*200:60+Math.random()*(W-120),y:H+r+20,r,rot:0,vr:(Math.random()-.5)*2.4,
          a:[a0,a0+1.6+Math.random()*.9,a0+3.6+Math.random()*1.2],vx:(Math.random()-.5)*90});
        if(Math.random()<.45)phis.push({x:80+Math.random()*(W-160),y:H+40});
      }
      for(let i=tris.length-1;i>=0;i--){const o=tris[i];o.y-=vs*dt;o.x+=o.vx*dt;o.rot+=o.vr*dt;

      }

/* ================= STAGE 4 — THE PENTAGON (boss) ================= */
function Stage4(){

  const w={segs,blocks,minX:20,maxX:1580},p=newPlayer(180,GY),parts=[];
  const B={x:1250,y:210,r:100,hp:24,max:24,state:'intro',t:0,flash:0,vy:0,beams:[],spin:0};
  let hp=5,proj=null,cd=0,t=0,waves=[],shards=[],dying=0;

  const hurt=(dir)=>{if(p.inv>0||dying)return;hp--;p.inv=1.3;p.vy=-430;p.vx=dir*380;p.kb=.25;p.ground=null;G.shake=14;sfx.hurt();burst(parts,p.x,p.y-30,14,{color:ORANGE})};
  return{dbg:{p,B,get hp(){return hp},get waves(){return waves}},name:'XV · THE PENTAGON',hint:'X  throw φ  (it seeks the polytope when you are close)     SPACE  jump',parts,
    hud(){
      for(let i=0;i<5;i++){c.globalAlpha=i<hp?1:.2;drawPhi(W-40-i*34,40,22,.3,ORANGE)}c.globalAlpha=1;
      const bw=420;c.strokeStyle='#fff';c.lineWidth=1.5;c.strokeRect(W/2-bw/2,H-44,bw,8);c.fillStyle=GOLD;c.fillRect(W/2-bw/2,H-44,bw*Math.max(0,B.hp)/B.max,8);
      node(W/2-bw/2,H-40,5);node(W/2+bw/2,H-40,5);
    },
    update(dt){
      if(dying>0){dying+=dt;updParts(parts,dt);platStep(p,w,dt);
        if(dying>2.6)this.done=true;return}
      t+=dt;platStep(p,w,dt);cd-=dt;B.t+=dt;B.flash-=dt;B.spin+=dt;
      // throw
      if(tapped('fire')&&cd<=0&&!proj){
        cd=.5;p.throwT=.18;sfx.throw();
        const dx=B.x-p.x,dy=B.y-(p.y-45),d=Math.hypot(dx,dy);
        proj=d<500?{x:p.x,y:p.y-45,vx:dx/d*980,vy:dy/d*980,l:0}:{x:p.x,y:p.y-45,vx:p.face*980,vy:-60,l:0};
        if(d<500)p.face=Math.sign(dx)||1;
      }
      if(proj){proj.x+=proj.vx*dt;proj.y+=proj.vy*dt;proj.l+=dt;
        if(Math.hypot(proj.x-B.x,proj.y-B.y)<B.r+6&&B.state!=='intro'){
          B.hp--;B.flash=.15;G.shake=8;sfx.bossHit();burst(parts,proj.x,proj.y,14,{g:200});proj=null;
          if(B.hp<=0){dying=.001;G.shake=30;G.flash=1;sfx.boom();waves=[];shards=[];B.beams=[];
            for(let i=0;i<160;i++)burst(parts,B.x+(Math.random()-.5)*140,B.y+(Math.random()-.5)*140,1,{speed:700,life:2,len:26,g:300});return}
        }else if(proj.l>.8)proj=null}
      // boss brain
      const ph=phase(),S=B.state;
      if(S==='intro'){B.x=lerp(B.x,1150,dt*2);if(B.t>1.6){B.state='hover';B.t=0}}
      else if(S==='hover'){
        B.x=lerp(B.x,800+Math.sin(t*.55)*540,dt*1.6);B.y=lerp(B.y,215+Math.sin(t*1.1)*60,dt*2);
        if(B.t>[0,2.3,1.7,1.15][ph]){
          const q=Math.random();B.t=0;
          if(q<.42){B.state='beam';const n=[0,1,3,5][ph],a=Math.atan2(p.y-35-B.y,p.x-B.x);B.beams=[];
            for(let i=0;i<n;i++)B.beams.push(a+(i-(n-1)/2)*.3)}
          else if(q<.75||ph===1)B.state='slamA';
          else{B.state='shards';const n=5+ph*2;for(let i=0;i<n;i++)shards.push({x:60+Math.random()*1480,y:-200-Math.random()*500,rot:Math.random()*TAU,v:520+Math.random()*160})}
        }
      }

        if(B.t>.8&&!B.fired){B.fired=true;sfx.beam();G.shake=6}

/* ================= THE ORBIT — gravitation ================= */
function StageOrbit(){
  const pl=[{x:900,y:360,r:90,mu:9e6,sh:'ico'},{x:2100,y:200,r:120,mu:1.6e7,sh:'dod'},{x:3300,y:500,r:70,mu:7e6,sh:'ico'}];
  const rings=[[520,360],[900,110],[1180,400],[1560,300],[2100,-130],[2440,240],[2860,440],[3300,270],[3720,500]].map(([x,y])=>({x,y}));
  const parts=[],THR=420,cam={x:300,y:360};let p={x:200,y:360,vx:0,vy:0},ri=0,t=0;
  const grav=(x,y)=>{let ax=0,ay=0;for(const b of pl){const dx=b.x-x,dy=b.y-y,d=Math.max(Math.hypot(dx,dy),b.r*.8),a=Math.min(b.mu/(d*d),900);ax+=dx/d*a;ay+=dy/d*a}return[ax,ay]};
  const nearest=()=>{let bb=pl[0],bd=1e9;for(const b of pl){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<bd){bd=d;bb=b}}return[bb,bd]};
  return{dbg:{pl,rings,grav,get p(){return p},get ri(){return ri}},name:'IX · THE ORBIT',hint:'← → ↑ ↓  thrust     —     fly through the rings in order,  let gravity bend your path',parts,
    lab(){const[b,d]=nearest(),v=Math.hypot(p.vx,p.vy);return['v = '+(v/100).toFixed(2)+' m/s','r = '+(d/100).toFixed(2)+' m  to nearest mass','g = GM/r² = '+(b.mu/(d*d)/100).toFixed(2)+' m/s²','orbit speed √(GM/r) = '+(Math.sqrt(b.mu/d)/100).toFixed(2)+' m/s']},
    respawn(){const r=ri?rings[ri-1]:{x:200,y:360};p={x:r.x,y:r.y,vx:0,vy:0}},
    update(dt){
      t+=dt;const ax=(held('right')?1:0)-(held('left')?1:0),ay=(held('down')?1:0)-(held('up')?1:0),[gx,gy]=grav(p.x,p.y);
      p.vx+=(gx+ax*THR)*dt;p.vy+=(gy+ay*THR)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.ax=ax;p.ay=ay;
      if((ax||ay)&&Math.random()<dt*50)burst(parts,p.x,p.y-20,1,{ang:Math.atan2(-ay,-ax),spread:.6,speed:260,life:.4,color:GOLD,g:0});
      for(const b of pl)if(Math.hypot(b.x-p.x,b.y-(p.y-25))<b.r+16){this.dead=true;sfx.hurt();return}
      const r=rings[ri];

      else if(Math.hypot(r.x-p.x,r.y-p.y)>2300){this.dead=true;sfx.hurt();return}

    },
    draw(){
      drawStars(cam.x,cam.y,.6);

      for(const b of pl){
        c.strokeStyle='#fff';c.lineWidth=1;for(let k=1;k<=5;k++){c.globalAlpha=.16/k+.02;c.beginPath();c.arc(b.x,b.y,b.r+k*k*22,0,TAU);c.stroke()}c.globalAlpha=1;
        const g=c.createRadialGradient(b.x,b.y,b.r*.2,b.x,b.y,b.r);g.addColorStop(0,'#3d3418');g.addColorStop(1,'#0a0a0a');c.fillStyle=g;c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.fill();
        c.strokeStyle='#fff';c.lineWidth=2;c.stroke();drawShape(SH[b.sh],b.x,b.y,b.r*1.05,t*.3+b.x,{lw:1.2,alpha:.7,nodes:false,color:GOLD});
        text('M',b.x,b.y,22,'#fff')}
      c.strokeStyle='#fff';c.globalAlpha=.2;c.lineWidth=1;c.setLineDash([6,10]);c.beginPath();c.moveTo(200,360);rings.forEach(r=>c.lineTo(r.x,r.y));c.stroke();c.setLineDash([]);c.globalAlpha=1;
      rings.forEach((r,i)=>{if(i<ri)return;const curR=i===ri,last=i===rings.length-1;
        c.save();if(curR){c.shadowColor=GOLD;c.shadowBlur=24}c.strokeStyle=curR?GOLD:'#fff';c.globalAlpha=curR?1:.45;c.lineWidth=curR?3:1.5;
        c.beginPath();c.arc(r.x,r.y,46+(curR?Math.sin(t*6)*3:0),0,TAU);c.stroke();c.restore();
        if(last)drawPhi(r.x,r.y,36,.3,GOLD,curR?GOLD:null);else text(''+(i+1),r.x,r.y,18,curR?GOLD:'#fff8')});
      // predicted free-fall path

/* ================= THE SINE WAVE — trigonometry & waves ================= */

  let x=-200;const rest=wd=>{const s={x1:x,y1:Y0,x2:x+wd,y2:Y0};segs.push(s);cps.push({x:x+wd/2,y:Y0});x+=wd;return s};

    x+=90;secs.push({i,x0,x1:x});rest(i===2?700:320)}

    respawn(){Object.assign(p,newPlayer(cp.x,cp.y))},
    update(dt){
      t+=dt;for(const s of pads){const y=Y0+F[s.sec](s.x1+60,t);s.rise=Math.max(0,s.y1-y);s.y1=s.y2=y}
      platStep(p,w,dt);
      if(p.ground&&!p.ground.sec&&p.ground.sec!==0){const q=cps.find(q=>q.x>=p.ground.x1&&q.x<=p.ground.x2);if(q)cp=q}
      for(const f of phis)if(!f.got&&Math.hypot(p.x-(f.s.x1+60),p.y-34-(f.s.y1-70))<44){f.got=true;G.phi++;sfx.phi()}

/* ================= THE PRIMES — number theory ================= */
function StagePrimes(){
  const TW=50,Y0=470,N=89,parts=[],notes=[],isP=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true};

  for(let n=1;n<=N;n++)tiles.push({n,x1:250+n*TW,y1:Y0,x2:250+n*TW+TW,y2:Y0,prime:isP(n),gone:false,lit:false});
  const w={segs:[]},p=newPlayer(0,Y0),cam={x:300};let t=0,cp={x:0,y:Y0},lastN=0;
  const rebuild=()=>{w.segs=[start,end].concat(tiles.filter(q=>!q.gone))};rebuild();
  return{dbg:{p,tiles,end,isP},name:'XI · THE PRIMES',hint:'← →  move     SPACE  jump     —     only prime numbers will hold you',parts,
    lab(){let nx=lastN+1;while(!isP(nx))nx++;return['last tile  n = '+lastN,'primes so far: '+tiles.filter(q=>q.lit).length,'gap to next prime: '+(nx-lastN)]},
    respawn(){Object.assign(p,newPlayer(cp.x,cp.y));for(const q of tiles)q.gone=false;rebuild()},
    update(dt){
      t+=dt;platStep(p,w,dt);
      const gr=p.ground;
      if(gr&&gr.n){lastN=gr.n;
        if(gr.prime){if(!gr.lit){gr.lit=true;G.phi++;tone(440*Math.pow(2,(gr.n%12)/12),.15,'sine',.1)}cp={x:gr.x1+TW/2,y:Y0}}
        else{gr.gone=true;rebuild();p.ground=null;p.vy=120;sfx.stumble();G.shake=6;burst(parts,gr.x1+TW/2,Y0,14,{});notes.push({x:gr.x1+TW/2,y:Y0-60,s:fac(gr.n),l:0})}}
      for(let i=notes.length-1;i>=0;i--){notes[i].l+=dt;notes[i].y-=30*dt;if(notes[i].l>2.2)notes.splice(i,1)}
      if(p.y>1100){this.dead=true;sfx.hurt();return}
      if(p.ground===end&&p.x>end.x1+250)this.done=true;
      updParts(parts,dt);cam.x=lerp(cam.x,p.x+170,dt*6);
    },
    draw(){

      for(const s of[start,end]){c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(s.x2,s.y2);c.stroke();node(s.x1,s.y1,5);node(s.x2,s.y2,5)}
      for(const q of tiles){if(q.x2<cam.x-700||q.x1>cam.x+700||q.gone)continue;
        c.fillStyle=q.lit?'rgba(255,210,58,.22)':'rgba(255,255,255,.05)';c.fillRect(q.x1+3,Y0,TW-6,TW-6);
        c.strokeStyle=q.lit?GOLD:'#fff';c.lineWidth=q.lit?2.5:1.5;c.strokeRect(q.x1+3,Y0,TW-6,TW-6);
        text(''+q.n,q.x1+TW/2,Y0+TW/2-3,q.n>9?17:19,q.lit?GOLD:'#fff','center',400)}
      for(const q of notes){c.globalAlpha=clamp(2.2-q.l,0,1);text(q.s,q.x,q.y,18,'#ff8a70');c.globalAlpha=1}
      drawPhi(end.x1+330,Y0-80+Math.sin(t*2)*6,56,.3,GOLD,GOLD);
      drawParts(parts);drawPlayer(p);c.restore();
      text('2 · 3 · 5 · 7 · 11 · 13 · …',W/2,42,17,'#fffa');

/* ================= THE MIRROR — optics ================= */
function StageMirror(){

    {em:{x:120,y:160,a:0},mir:[{x:520,y:160,a:100},{x:520,y:540,a:10}],walls:[],glass:[],tg:{x:1100,y:540},tip:'two mirrors make a periscope'},
    {em:{x:120,y:380,a:0},mir:[{x:400,y:380,a:80},{x:400,y:120,a:10},{x:900,y:120,a:70}],walls:[[640,200,640,620]],glass:[],tg:{x:900,y:540},tip:'light travels in straight lines, so go around the wall'},
    {em:{x:140,y:200,a:8,rot:true},mir:[],walls:[[900,0,900,430]],glass:[{x:470,y:60,w:260,h:600}],tg:{x:1120,y:560},tip:'refraction:  n₁·sin θ₁ = n₂·sin θ₂    (glass n = 1.5)'},
    {em:{x:140,y:600,a:-35},mir:[{x:900,y:137,a:75},{x:900,y:560,a:15}],walls:[],glass:[{x:420,y:150,w:240,h:420}],tg:{x:1180,y:560},tip:'a glass slab shifts the beam sideways but keeps its direction'}];
  const segHit=(x,y,dx,dy,x1,y1,x2,y2)=>{const ex=x2-x1,ey=y2-y1,den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)return null;const t=((x1-x)*ey-(y1-y)*ex)/den,u=((x1-x)*dy-(y1-y)*dx)/den;return t>1e-3&&u>=0&&u<=1?t:null};

  function trace(P){
    let x=P.em.x,y=P.em.y,dx=Math.cos(P.em.a*D),dy=Math.sin(P.em.a*D),inside=false,hit=false;const pts=[[x,y]],marks=[],S=[];
    for(const m of P.mir)S.push([...mEnds(m),'m']);for(const q of P.walls)S.push([...q,'w']);

    for(const q of P.glass)S.push([q.x,q.y,q.x+q.w,q.y,'g'],[q.x+q.w,q.y,q.x+q.w,q.y+q.h,'g'],[q.x+q.w,q.y+q.h,q.x,q.y+q.h,'g'],[q.x,q.y+q.h,q.x,q.y,'g']);
    for(let b=0;b<16;b++){let bt=1e9,bs=null;for(const q of S){const tt=segHit(x,y,dx,dy,q[0],q[1],q[2],q[3]);if(tt!=null&&tt<bt){bt=tt;bs=q}}
      const fx=P.tg.x-x,fy=P.tg.y-y,pr=fx*dx+fy*dy,d2=fx*fx+fy*fy-pr*pr;
      if(pr>0&&d2<TR*TR){const tt=pr-Math.sqrt(TR*TR-d2);if(tt<bt){pts.push([x+dx*tt,y+dy*tt]);hit=true;break}}
      if(!bs)break;x+=dx*bt;y+=dy*bt;pts.push([x,y]);if(bs[4]==='w')break;
      let nx=-(bs[3]-bs[1]),ny=bs[2]-bs[0];const nl=Math.hypot(nx,ny);nx/=nl;ny/=nl;let dn=dx*nx+dy*ny;if(dn>0){nx=-nx;ny=-ny;dn=-dn}

  return{dbg:{PZ,trace,get pi(){return pi},set pi(v){pi=v}},name:'XII · THE MIRROR',hint:'← →  choose a mirror     ↑ ↓  rotate it     —     guide the light onto the target',parts,
    lab(){const o=rots()[sel],L=['puzzle '+(pi+1)+' / '+PZ.length,'selected angle = '+(((-o.a%360)+360)%360).toFixed(1)+'°'];for(const m of res.marks.slice(-2))L.push(m.t);return L},
    update(dt){

      // beam

        if(on){c.strokeStyle=GOLD;c.globalAlpha=.4;c.lineWidth=1;c.setLineDash([4,6]);c.beginPath();c.arc(m.x,m.y,ML/2+10,0,TAU);c.stroke();c.setLineDash([]);c.globalAlpha=1}});
      const E=P.em,eo=R[sel]===E;c.save();c.translate(E.x,E.y);c.rotate(E.a*D);c.fillStyle='#000';c.strokeStyle=eo?GOLD:'#fff';c.lineWidth=2;c.fillRect(-34,-13,40,26);c.strokeRect(-34,-13,40,26);c.restore();

  return{dbg:{yT,sl,HL,gaps,gates,g,BASE,END,get x(){return air?air.x:x},get v(){return v},get air(){return air},get fuel(){return fuel}},
    name:'XIII · THE COASTER',hint:'→  boost (uses fuel)     ←  brake     —     trade height for speed,  obey the speed gates',parts,

    update(dt){

/* ================= THE GALTON BOARD — probability ================= */
function StageGalton(){
  const N=10,BW=80,CX=W/2,TOPY=96,ROW=36,FLOOR=520,STEP=.26,parts=[];
  const RD=[{gold:40,red:0,p:.5,need:17,tip:'each peg is a coin flip:  left or right, 50 / 50'},{gold:40,red:0,p:.68,need:17,tip:'the pegs are biased:  68% go right  →  the peak moves to n·p'},{gold:34,red:20,p:.5,need:12,tip:'red balls cost 2 and fall from a source 3 bins to the right'}];
  const C=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r},pk=(k,p)=>C(N,k)*p**k*(1-p)**(N-k);
  const binX=k=>CX+(k-N/2)*BW;
  let ri=0,R=rng(77),balls,queue,hist,score,spawn,px=CX,ph=0,t=0,face=1,endT=0,tries=0;
  const start=()=>{const rd=RD[ri];R=rng(77+ri*13+tries*7);balls=[];hist=Array(N+1).fill(0);score=0;spawn=.8;endT=0;
    queue=[];for(let i=0;i<rd.gold;i++)queue.push(0);for(let i=0;i<rd.red;i++)queue.push(1);for(let i=queue.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}};
  start();
  const bpos=b=>{const u=b.t/STEP,sh=b.red?3:0;if(u>=N){const f=clamp((b.t-N*STEP)/.38,0,1);return[binX(b.bin),lerp(TOPY+N*ROW,FLOOR-12,f*f)]}
    const r=Math.floor(u),f=u-r,e=f*f*(3-2*f),xa=CX+(b.k[r]-r/2+sh)*BW,xb=CX+(b.k[r+1]-(r+1)/2+sh)*BW;return[clamp(lerp(xa,xb,e),binX(0),binX(N)),TOPY+u*ROW-Math.sin(Math.PI*f)*9]};
  return{dbg:{RD,binX,STEP,N,get balls(){return balls},get px(){return px},get score(){return score},get ri(){return ri},get left(){return queue.length}},
    name:'XIV · THE GALTON BOARD',hint:'← →  move     —     catch the falling φ,  stand where the odds are best',parts,
    hud(){const rd=RD[ri];text('caught  '+score+'  /  need '+rd.need+'        left  '+(queue.length+balls.length),W/2,70,16,score>=rd.need?GOLD:'#fff')},
    lab(){const rd=RD[ri],k=clamp(Math.round((px-CX)/BW+N/2),0,N);return['round '+(ri+1)+' / 3      n = '+N+'   p = '+rd.p,'mean  μ = n·p = '+(N*rd.p).toFixed(1),'spread σ = √(n·p·q) = '+Math.sqrt(N*rd.p*(1-rd.p)).toFixed(2),'P(bin '+k+') = C('+N+','+k+')·pᵏ·qⁿ⁻ᵏ = '+(pk(k,rd.p)*100).toFixed(1)+'%']},
    respawn(){tries++;start()},
    update(dt){
      t+=dt;const rd=RD[ri],ax=(held('right')?1:0)-(held('left')?1:0);
      px=clamp(px+ax*440*dt,binX(0),binX(N));if(ax){face=ax;ph+=dt*14}
      spawn-=dt;
      if(spawn<=0&&queue.length){spawn=.42;const red=queue.pop(),k=[0];for(let r=0;r<N;r++)k.push(k[r]+(R()<rd.p?1:0));balls.push({k,red,t:0,bin:clamp(k[N]+(red?3:0),0,N)})}
      for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.t+=dt;
        if(b.t>=N*STEP+.38){balls.splice(i,1);const bx=binX(b.bin);
          if(!b.red)hist[b.bin]++;
          if(Math.abs(px-bx)<BW/2+2){if(b.red){score-=2;sfx.hurt();G.shake=8;burst(parts,bx,FLOOR-40,12,{color:'#ff5a3a'})}else{score++;G.phi++;sfx.phi();burst(parts,bx,FLOOR-50,8,{color:GOLD,g:0})}}
          else burst(parts,bx,FLOOR,4,{ang:-Math.PI/2,spread:2,speed:120,life:.3,color:b.red?'#ff5a3a':'#fff'})}}
      if(!queue.length&&!balls.length){endT+=dt;if(endT>.9){if(score>=rd.need){if(ri===RD.length-1){this.done=true;return}ri++;tries=0;sfx.clear();G.flash=.3;start()}else{this.dead=true;sfx.hurt();return}}}
      updParts(parts,dt);
    },
    draw(){
      const rd=RD[ri];drawStars(0,0,.25);
      for(let r=0;r<N;r++)for(let i=0;i<=r;i++){if(rd.red){c.globalAlpha=.35;const x=CX+(i-r/2+3)*BW;if(x<=binX(N)+1)node(x,TOPY+r*ROW+10,2.5,1)}c.globalAlpha=1;node(CX+(i-r/2)*BW,TOPY+r*ROW+10,3.5,1.2)}
      c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(binX(0)-BW/2,FLOOR);c.lineTo(binX(N)+BW/2,FLOOR);c.stroke();
      c.lineWidth=1;c.globalAlpha=.4;c.beginPath();for(let k=0;k<=N+1;k++){const x=binX(k)-BW/2;c.moveTo(x,FLOOR-70);c.lineTo(x,FLOOR+150)}c.stroke();c.globalAlpha=1;
      const tot=hist.reduce((a,b)=>a+b,0),mx=Math.max(6,...hist,rd.gold*pk(Math.round(N*rd.p),rd.p)),sc=120/mx;
      for(let k=0;k<=N;k++){c.fillStyle='rgba(255,210,58,.5)';c.fillRect(binX(k)-BW/2+5,FLOOR+6,BW-10,hist[k]*sc);text(''+k,binX(k),FLOOR+166,13,'#fff9');if(hist[k])text(''+hist[k],binX(k),FLOOR+18+hist[k]*sc,12,'#fff')}
      c.strokeStyle='#6fd0ff';c.lineWidth=2;c.beginPath();for(let k=0;k<=N;k++){const y=FLOOR+6+rd.gold*pk(k,rd.p)*sc;k?c.lineTo(binX(k),y):c.moveTo(binX(k),y)}c.stroke();
      for(let k=0;k<=N;k++)node(binX(k),FLOOR+6+rd.gold*pk(k,rd.p)*sc,3,1);
      text('expected (binomial)',binX(N)+BW/2+8,FLOOR+40,12,'#6fd0ff','left');text('landed',binX(N)+BW/2+8,FLOOR+60,12,GOLD,'left');
      for(const b of balls){const q=bpos(b);if(b.red){c.save();c.shadowColor='#ff5a3a';c.shadowBlur=14;c.fillStyle='#ff5a3a';c.beginPath();c.arc(q[0],q[1],9,0,TAU);c.fill();c.restore()}else drawPhi(q[0],q[1],20,b.t*5,GOLD,GOLD)}
      drawParts(parts);
      c.strokeStyle=GOLD;c.lineWidth=2.5;c.beginPath();c.moveTo(px-30,FLOOR-88);c.lineTo(px-22,FLOOR-70);c.lineTo(px+22,FLOOR-70);c.lineTo(px+30,FLOOR-88);c.stroke();
      drawStick(px,FLOOR,{pose:(held('left')||held('right'))?'run':'jump',ph,face,s:.92});
      text(rd.tip,W/2,40,17,'#fffa');
    }};
}

function update(dt){
  G.t+=dt;G.shake=Math.max(0,G.shake-dt*40);G.flash=Math.max(0,G.flash-dt*.9);
  if(hit.KeyM)G.mute=!G.mute;if(hit.KeyB)G.bloom=!G.bloom;if(hit.KeyH)G.help=!G.help;else if(G.help&&(hit.Escape||hit.Enter)){G.help=false;return}
  if(G.help)return;
  if(G.trans){const T=G.trans;T.t+=dt;if(!T.done&&T.t>=.45){T.done=true;T.fn()}if(T.t>=.9)G.trans=null;G.fade=T.t<.45?T.t/.45:1-(T.t-.45)/.45}else G.fade=0;
  if(G.state==='title'){if(G.trans)return;if(hit.KeyT||(tapped('start')&&!SAVE.tut))goto(startTutorial);else if(tapped('start'))goto(()=>{G.state='select';G.sel=Math.min(SAVE.unlocked,NL)-1});return}
  if(G.state==='select'){
    if(G.trans)return;
    if(tapped('right')){G.sel=(G.sel+1)%NL;tone(660,.06,'sine',.08)}
    if(tapped('down')){G.sel=G.sel+5<NL?G.sel+5:G.sel%5;tone(660,.06,'sine',.08)}
    if(hit.ArrowUp||hit.KeyW){let q=G.sel-5;if(q<0){q=G.sel;while(q+5<NL)q+=5}G.sel=q;tone(660,.06,'sine',.08)}
    if(tapped('left')){G.sel=(G.sel+NL-1)%NL;tone(660,.06,'sine',.08)}
    for(let i=0;i<NL;i++)if(hit['Digit'+(i+1)])G.sel=i;
    if(hit.Escape)goto(()=>{G.state='title'});
    if(hit.KeyT){goto(startTutorial);return}
    if(tapped('start')){
      if(G.sel<SAVE.unlocked){const i=G.sel;G.phi=0;G.deaths=0;G.time=0;goto(()=>startStage(i))}
      else{sfx.stumble();G.shake=6}
    }
    return;
  }
  if(G.result){ // chapter-complete card
    G.result.t+=dt;
    if(G.result.t>.8&&tapped('start')&&!G.trans){const n=G.stage+1;goto(()=>startStage(n))}
    if(hit.Escape&&!G.trans)resetGame();
    return;
  }
  if(G.brief){if(tapped('start')&&!G.trans&&!(G.trans&&!G.trans.done)){G.brief=false;G.banner=3.4}if(hit.Escape&&!G.trans)resetGame();return}
  if(hit.KeyP)G.paused=!G.paused;
  if(hit.Escape&&!G.trans){if(G.paused){G.paused=false;resetGame()}else G.paused=true}
  if(G.paused||(G.trans&&!G.trans.done))return;
  if(hit.KeyR&&!ST.final){G.deaths++;if(ST.respawn)ST.respawn();else ST=STAGES[G.stage]();return}
  G.banner-=dt;if(!ST.final){G.time+=dt;G.run.t+=dt}
  if(!ST.done)ST.update(dt);
  if(ST.dead){ST.dead=false;G.deaths++;G.flash=.5;G.shake=18;
    if(ST.respawn)ST.respawn();else{const i=G.stage;goto(()=>{if(G.state==='play'&&G.stage===i){ST=STAGES[i]();G.banner=2}})}}
  else if(ST.done&&ST.tutorial){if(!G.trans){SAVE.tut=true;persist();sfx.clear();resetGame()}}
  else if(ST.done&&!G.trans&&!G.result){
    sfx.clear();const i=G.stage,falls=G.deaths-G.run.deaths,t=G.run.t;
    const rank=falls===0?'S':falls<=1?'A':falls<=3?'B':'C',best=SAVE.best[i];
    const rec=!best||t<best.t;if(rec)SAVE.best[i]={t,rank};
    SAVE.unlocked=Math.max(SAVE.unlocked,Math.min(NL,i+2));persist();
    G.result={t:0,time:t,phi:G.phi-G.run.phi,falls,rank,rec};
  }
}

}
function drawHelp(){
  c.fillStyle='rgba(0,0,0,.86)';c.fillRect(0,0,W,H);
  text('CONTROLS',W/2,56,28,'#fff','center',200);
  const G1=[['← →  /  A D','move'],['SPACE  /  ↑  /  W','jump'],['X  /  J','use φ  (throw · hook · resize · flip)'],['P','pause'],['R','retry chapter from checkpoint'],['ESC','pause  →  chapter select'],['M','mute sound'],['B','toggle glow'],['H','this screen'],['T','tutorial  (from the title or chapter screen)']];
  const G2=[['I  The Line','run, jump gaps and posts'],['II  Golden Spiral','SPACE jump · stay low under hanging nodes'],['III  The Angle','SPACE jump · ← brake · → tuck'],['IV  The Void','← → ↑ ↓ steer'],['V  The Tesseract','hold X hook · release to fly · ← → pump'],['VI  Golden Blocks','push · X resize · hold ↓ to drag'],['VII  The Parabola','↑ ↓ angle · ← → power · SPACE launch'],['VIII  The Charge','X or SPACE flip charge'],['IX  The Orbit','← → ↑ ↓ thrust'],['X  The Sine Wave','run and jump'],['XI  The Primes','run and jump · primes only'],['XII  The Mirror','← → choose · ↑ ↓ rotate'],['XIII  The Coaster','→ boost · ← brake'],['XIV  The Galton Board','← → move and catch'],['XV  The Pentagon','X throw φ · SPACE jump']];
  text('EVERYWHERE',120,110,12,GOLD,'left',500);G1.forEach((r,i)=>{text(r[0],120,140+i*30,15,'#fff','left',500);text(r[1],300,140+i*30,15,'#fffb','left')});
  text('PER CHAPTER',680,110,12,GOLD,'left',500);G2.forEach((r,i)=>{text(r[0],680,140+i*30,15,'#fff','left',500);text(r[1],880,140+i*30,15,'#fffb','left')});
  text('touch screens get on-screen buttons      ·      H  or  ESC  to close',W/2,676,14,'#fff9');
}
function drawTitle(){
  const t=G.t;drawStars(t*20,0,.4);
  drawShape(SH.c24,930,330,250,t*.7,{spin:t*.3,lw:1.6,glow:'#fff'});
  c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(0,520);c.lineTo(820,520);c.stroke();node(820,520,5);
  drawStick(330,520,{pose:'run',ph:t*13,face:-1});
  drawPhi(250,440+Math.sin(t*2)*6,46,.35,GOLD,GOLD);
  text('STICKMAN',90,150,74,'#fff','left',200);text('vs',92,214,30,ORANGE,'left',300);text('GEOMETRY',140,218,74,'#fff','left',200);
  if(Math.floor(t*1.6)%2)text(TOUCH?'tap to play':'press ENTER',90,300,20,GOLD,'left');
  text('← →  move      SPACE  jump      X  throw φ      P  pause      R  retry      M  mute',W/2,640,15,'#fff9');
  text('T  tutorial      H  all controls      B  toggle glow',W/2,668,13,'#fff7');
}
function draw(){
  c.setTransform(VS,0,0,VS,0,0);c.fillStyle='#000';c.fillRect(0,0,W,H);
  c.save();if(G.shake>0)c.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  if(G.state==='title')drawTitle();
  else if(G.state==='select')drawSelect();
  else if(ST){
    ST.draw();
    c.restore();c.save();
    text(ST.name,28,34,15,'#fffb','left',400);
    if(!ST.final){drawPhi(34,66,18,.3,GOLD);text('× '+G.phi,50,67,15,GOLD,'left',400)}
    if(ST.hud)ST.hud();
    if(ST.lab&&!G.result&&!G.brief){const L=ST.lab();c.font='13px Menlo,Consolas,monospace';c.textAlign='left';c.textBaseline='middle';
      c.fillStyle='rgba(0,0,0,.45)';c.fillRect(18,H-34-L.length*19,330,L.length*19+16);c.fillStyle='#d8f0ff';L.forEach((q,i)=>c.fillText(q,28,H-22-(L.length-1-i)*19-4))}
    if(G.banner>0&&!G.brief){c.globalAlpha=clamp(G.banner,0,1);text(ST.name,W/2,150,34,'#fff','center',200);text(ST.hint,W/2,192,15,GOLD);c.globalAlpha=1}
    if(G.result)drawResult();
    if(G.brief&&G.stage>=0)drawBrief();
    if(G.paused){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,W,H);text('PAUSED',W/2,H/2,40,'#fff','center',200);text('P  resume      H  controls      ESC  chapters',W/2,H/2+44,14,'#fff9')}
  }
  c.restore();
  if(G.bloom&&HASFILTER){c.save();c.globalCompositeOperation='lighter';c.filter='blur(6px)';c.globalAlpha=.4;c.drawImage(cv,0,0,W,H);
    c.filter='blur(22px)';c.globalAlpha=.28;c.drawImage(cv,0,0,W,H);c.restore()}
  c.fillStyle=VIG;c.fillRect(0,0,W,H);
  if(G.help)drawHelp();
  if(TOUCH&&innerHeight>innerWidth){c.fillStyle='rgba(0,0,0,.8)';c.fillRect(0,H/2-60,W,120);text('↻  turn your phone sideways',W/2,H/2,44,'#fff','center',200)}
  if(G.flash>0){c.fillStyle=`rgba(255,240,200,${Math.min(1,G.flash)*.8})`;c.fillRect(0,0,W,H)}
  if(G.fade>0){c.fillStyle=`rgba(0,0,0,${G.fade})`;c.fillRect(0,0,W,H)}
}
const HASFILTER=typeof c.filter==='string';
const VIG=(()=>{const g=c.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.6)');return g})();
let last=performance.now();
function frame(now){
  if(innerWidth!==frame.w||innerHeight!==frame.h){frame.w=innerWidth;frame.h=innerHeight;resize()}
  const dt=Math.min((now-last)/1000,1/30);last=now;
  update(dt);musicTick(dt);draw();
  for(const k in hit)delete hit[k];
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
